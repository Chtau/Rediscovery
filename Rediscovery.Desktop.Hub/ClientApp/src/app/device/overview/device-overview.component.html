<app-pending-authentication></app-pending-authentication>
<h3>Connected Devices</h3>
<clr-datagrid>
  <clr-dg-column>Name</clr-dg-column>
  <clr-dg-column>Model</clr-dg-column>

  <clr-dg-row *ngFor="let model of connectedDeviceModels">
    <clr-dg-action-overflow>
      <button class="action-item" (click)="onEditConnected(model)">Edit</button>
    </clr-dg-action-overflow>
    <clr-dg-cell>{{model.name}}</clr-dg-cell>
    <clr-dg-cell>{{model.manufacturer}} {{model.model}}</clr-dg-cell>
  </clr-dg-row>

  <clr-dg-footer>{{connectedDeviceModels.length}} Devices</clr-dg-footer>
</clr-datagrid>
<h3>Registered Devices</h3>
<clr-datagrid>
  <clr-dg-column>Name</clr-dg-column>
  <clr-dg-column>Model</clr-dg-column>

  <clr-dg-row *ngFor="let model of registeredDeviceModels">
    <clr-dg-action-overflow>
      <button class="action-item" (click)="onEditRegistered(model)">Edit</button>
    </clr-dg-action-overflow>
    <clr-dg-cell>{{model.name}}</clr-dg-cell>
    <clr-dg-cell>{{model.manufacturer}} {{model.model}}</clr-dg-cell>
  </clr-dg-row>

  <clr-dg-footer>{{registeredDeviceModels.length}} Devices</clr-dg-footer>
</clr-datagrid>
