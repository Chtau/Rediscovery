<h3>Devices pending authentication</h3>
<clr-datagrid class="pending-datagrid" [(clrDgSelected)]="selectedPendingDevice">
  <clr-dg-action-bar>
    <div class="btn-group">
        <button type="button" [disabled]="selectedPendingDevice.length < 1" class="btn btn-sm btn-success" (click)="onAcceptSelectedPendingDevices()"><clr-icon shape="check"></clr-icon> Accept</button>
        <button type="button" [disabled]="selectedPendingDevice.length < 1" class="btn btn-sm btn-warning" (click)="onRemoveSelectedPendingDevices()"><clr-icon shape="close"></clr-icon> Remove</button>
    </div>
  </clr-dg-action-bar>
  <clr-dg-column>ID</clr-dg-column>
  <clr-dg-column>Name</clr-dg-column>

  <clr-dg-row *clrDgItems="let model of pendingDeviceModels" [clrDgItem]="model">
      <clr-dg-cell>{{model.id}}</clr-dg-cell>
      <clr-dg-cell>{{model.name}}</clr-dg-cell>
  </clr-dg-row>

  <clr-dg-footer>{{pendingDeviceModels.length}} Devices</clr-dg-footer>
</clr-datagrid>
