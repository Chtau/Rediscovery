<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <link type="text/css" rel="stylesheet" href="./css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <div id="container">
        <output></output>
        <div id="input-line" class="input-line">
            <div class="prompt"></div><div><input class="cmdline" autofocus /></div>
        </div>
    </div>
    <script type="text/javascript" src="./js/terminal.js"></script>
    <script>
        const term = undefined;
        function log(str) {
            logger(str);
        }
        function featureReceive(data) {
            // data received => {"Line":""}
            this.term.output(data.Line);
        }
        function profileChanged(data) {
            log(data);
        }
        function send(command) {
            try {
                featureSend(command);
            } catch (ex) { log(ex); }
        }

        (function () {
            try {
                document.querySelector("#input-line > div.prompt").innerText = '$ ';
                this.term = new Terminal('#input-line .cmdline', '#container output');
                this.term.init();

                setInterval(function () {
                    var headerDate = document.getElementById('header-date');
                    if (headerDate) {
                        document.getElementById('header-date').innerText = new Date();
                    }
                }, 1000);

                this.addEventListener('command', function (e) {
                    try {
                        send(e.detail);
                    } catch (ex) { log(ex); }
                }, false);
            } catch (ex) {
                log(ex);
            }
        })();
    </script>
</body>
</html>
