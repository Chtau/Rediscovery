<!DOCTYPE html>
<html>
<head>
    <link type="text/css" rel="stylesheet" href="./css/materialize.min.css" media="screen,projection" />
    <link type="text/css" rel="stylesheet" href="./css/style.css">
    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
    <div class="wrapper">
        <div class="top-content">
            <p id="result">Listener:</p>
        </div>
        <div class="center-content z-depth-2">
            <div class="content-info">
                <div class="info-album">The Hunting Party</div>
                <div class="info-song">Final Masquerade</div>
                <div class="info-artist">Linkin Park</div>
            </div>

            <div class="content-buttons">
                <ul class="list list-main-buttons">
                    <li><a class="btn-floating btn-large waves-effect waves-light red"><i class="material-icons">skip_previous</i></a></li>
                    <li><a class="btn-floating btn-large waves-effect waves-light red" onclick="javascript: playClick();"><i class="material-icons">play_arrow</i></a></li>
                    <li><a class="btn-floating btn-large waves-effect waves-light red"><i class="material-icons">skip_next</i></a></li>
                </ul>
            </div>
        </div>
        <div class="footer-content z-depth-2 grey lighten-2">
            <div class="footer-content-wrapper">
                <ul class="list list-footer-buttons">
                    <li><a class="btn-floating btn-small waves-effect waves-light white"><i class="material-icons">skip_previous</i></a></li>
                    <li><a class="btn-floating btn-small waves-effect waves-light white"><i class="material-icons">skip_previous</i></a></li>
                    <li><a class="btn-floating btn-small waves-effect waves-light white"><i class="material-icons">skip_previous</i></a></li>
                    <li><a class="btn-floating btn-small waves-effect waves-light white"><i class="material-icons">skip_previous</i></a></li>
                </ul>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./js/materialize.min.js"></script>
    <script>
        function featureReceive(data) {
            log(data);
        }

        function log(str) {
            var div = document.getElementById('result');
            div.innerHTML = JSON.stringify(str);
        }
        function playClick() {
            featureSend("1");
        };

        (function () {
            // your page initialization code here
            // the DOM will be available here

        })();
    </script>
</body>
</html>
