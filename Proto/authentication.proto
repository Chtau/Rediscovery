syntax = "proto3";

package protoAuthentication;

service AuthentionExchange {
  rpc Welcome (WelcomeDeviceMessage) returns (WelcomeDeviceReply);
}

message WelcomeDeviceMessage {
  string deviceIdentifier = 1;
}

message WelcomeDeviceReply {
  string token = 1;
  enum State {
    None = 0;
    OK = 1;
    Error = 2;
    Warning = 3;
    Offline = 4;
    Denied = 5;
    WaitForApprovel = 6;
  }
  State connectionState = 2;
}