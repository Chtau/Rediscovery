syntax = "proto3";

package featuredata;

service FeatureExchange {
  rpc ExchangeStream (stream DeviceFeatureData) returns (stream DeviceFeatureData);
  rpc Start (FeatureState) returns (FeatureState);
  rpc Stop (FeatureState) returns (FeatureState);
}

message FeatureState {
	string featureId = 1;
}

message DeviceFeatureData {
  string deviceId = 1;
  string featureId = 2;
  string profileId = 3;
  string data = 4;
}