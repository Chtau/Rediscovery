syntax = "proto3";

import "google/protobuf/empty.proto";
import "shared.proto";

package protoManifest;

service ManifestExchange {
  rpc Device (google.protobuf.Empty) returns (ManifestReply);
}

message ManifestReply {
  string clientName = 1;
  string clientVersion = 2;
  string appMinimumVersion = 3;
  repeated FeatureDefinitionExtended supportedFeatures = 4;
}