syntax = "proto3";

package hearthbeat;

service HearthbeatExchange {
  rpc Beat (stream PingMessage) returns (stream PongMessage);
}

message PingMessage {
  uint64 pingTime = 1;
  uint32 lastRoundTripTicks = 2;
  Command command = 3;

  enum Command {
    Beat = 0;
  }
}

message PongMessage {
  uint64 pongTime = 1;
  uint32 lastRoundTripTicks = 2;
  Command command = 3;

  enum Command {
    Beat = 0;
  }
}